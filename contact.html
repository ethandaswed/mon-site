<html>

<head>
    <title>Contact</title>

</head>

<body>  

    <nav>
    <a href="index.html" class="logo">Ethan Gallery</a>

    <button class="menu-mobile" id="menu-mobile">☰</button>

    <div class="liens">
        <a href="index.html">Accueil</a>

        <a href="contact.html">Contact</a>
        <a href="commande.html" class="bouton-nav-commander">Commander</a>
    </div>

    
</nav>

    <section class="contact-page">

    <div class="contact-entete">
        <p class="petit-titre">ETHAN GALLERY</p>

        <h1>Parlons de votre projet.</h1>

        <p>
            Une question, une idée ou envie de créer un tableau personnalisé ?
            Envoyez-moi un message et expliquez-moi votre projet.
            Je vous répondrai dès que possible.
        </p>
    </div>

    <form id="formulaire" action="https://formspree.io/f/xeaeoegv" method="POST">

       <p id="confirmation"></p>

<div class="champ-contact">
    <label for="nom">Votre nom</label>
    <input id="nom" name="nom" type="text" placeholder="Votre nom" required>
</div>

<div class="champ-contact">
    <label for="email">Votre e-mail</label>
    <input id="email" name="email" type="email" placeholder="exemple@email.com" required>
</div>

<div class="champ-contact">
    <label for="sujet">Sujet</label>
    <input id="sujet" name="sujet" type="text" placeholder="Ex : Question sur un tableau">
</div>

<div class="champ-contact">
    <label for="message">Votre message</label>
    <textarea id="message" name="message" placeholder="Écrivez votre message ici..." required></textarea>
</div>

<button type="submit" class="bouton-contact">
    Envoyer mon message
</button>

</form>

</section>

    <a href="index.html">Retour à l'accueil</a>
<script src="script.js"></script>
</body>

</html>
